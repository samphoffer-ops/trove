name: Deploy Supabase Edge Functions

# Auto-deploys whenever function source changes, or can be run manually.
# Requires SUPABASE_ACCESS_TOKEN secret — see README for one-time setup.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Deploy catalog-intake
        run: supabase functions deploy catalog-intake --project-ref xxyserlkigllpmtxzlsa --use-api --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy discover-brands
        run: supabase functions deploy discover-brands --project-ref xxyserlkigllpmtxzlsa --use-api --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The click-out redirect (#27). No JWT check: the browser opens it
      # directly with no Authorization header. It only redirects to the
      # stored URL of an active product, so it's not an open redirect.
      - name: Deploy go
        run: supabase functions deploy go --project-ref xxyserlkigllpmtxzlsa --use-api --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy delete-account
        run: supabase functions deploy delete-account --project-ref xxyserlkigllpmtxzlsa --use-api --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
