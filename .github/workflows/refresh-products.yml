name: Daily product refresh

# Runs every morning at 6:00 UTC (2 AM EST / 11 PM PST).
# Re-scrapes all currently-approved brands and upserts their products —
# catches new arrivals, price changes, and removed items.
# Can also be triggered manually from the Actions tab.
#
# Batches of 5 brands per call (each call ~45s). Supabase Edge Functions
# have a 150s idle timeout — a single refresh_all call on a large catalog
# times out silently, hence the small batches. Loops the offset until a
# batch comes back empty rather than a fixed count -- this used to stop
# at offset 45 (50 brands) no matter how large the approved catalog grew,
# so any brand past the first 50 (by creation order) never got refreshed
# again after its initial approval, ever. Confirmed in production: a
# brand created after position ~160 was still showing its original
# handful of scraped products while its live store had 3x as many.
#
# A curl failure/timeout on one batch (a slow-scraping brand, a transient
# network blip) must NOT be treated the same as a genuine empty batch --
# first attempt at this fix did exactly that (curl failure fell back to
# a fake "results":[] and the loop read that as "reached the end of the
# list"), which silently stopped the very first run after batch one,
# having refreshed nothing. Only a real HTTP 200 with an actually-empty
# results array means "done"; anything else just skips that batch and
# moves on to the next offset.
#
# GitHub Actions runs `run:` steps as `bash -e` -- any unguarded command
# returning non-zero kills the whole job immediately. Second attempt at
# this fix still had one: `cat file 2>/dev/null` on a batch that timed
# out before curl ever wrote the output file returns exit 1 (redirecting
# stderr hides the message, not the exit code), which aborted the entire
# run on the very first slow batch -- before the skip-and-continue logic
# below ever got a chance to run. Confirmed happening on the first real
# workflow_dispatch of this "fixed" version. Every command that can
# legitimately fail without that meaning the run should stop now has an
# explicit `|| true`.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  SUPABASE_URL: https://xxyserlkigllpmtxzlsa.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4eXNlcmxraWdsbHBtdHh6bHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MjQ2NzEsImV4cCI6MjA5NzIwMDY3MX0.69xsoMopJi39sCbHmQZC3I-AeZiP-aKg9KQns4CS6uk

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh brands in batches of 5
        run: |
          TOTAL=0
          OFFSET=0
          EMPTY_STREAK=0
          # Safety cap (200 batches = 1000 brands) so a genuine bug can't
          # spin this forever -- not a real ceiling on catalog size at
          # today's scale, just a backstop.
          for i in $(seq 1 200); do
            echo "Batch offset=$OFFSET"
            HTTP_CODE=$(curl -s -o /tmp/batch_result.json -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/catalog-intake" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"action\": \"refresh_all\", \"refresh_offset\": $OFFSET, \"refresh_limit\": 5}" \
              --max-time 120 || echo "000")
            cat /tmp/batch_result.json 2>/dev/null || true
            echo ""

            if [ "$HTTP_CODE" != "200" ]; then
              echo "  → request failed (HTTP $HTTP_CODE) -- skipping this batch, continuing"
              OFFSET=$((OFFSET + 5))
              sleep 5
              continue
            fi

            COUNT=$(jq '.results | length' /tmp/batch_result.json 2>/dev/null || echo "")
            if [ -z "$COUNT" ]; then
              echo "  → couldn't parse response -- skipping this batch, continuing"
              OFFSET=$((OFFSET + 5))
              sleep 5
              continue
            fi

            echo "  → $COUNT brands in this batch"
            TOTAL=$((TOTAL + COUNT))
            if [ "$COUNT" = "0" ]; then
              # Two genuinely-empty successful responses in a row means we've
              # actually reached the end -- one alone could just be an odd
              # gap (e.g. a brand row that got deleted between calls).
              EMPTY_STREAK=$((EMPTY_STREAK + 1))
              if [ "$EMPTY_STREAK" -ge 2 ]; then
                break
              fi
            else
              EMPTY_STREAK=0
            fi
            OFFSET=$((OFFSET + 5))
            sleep 5
          done
          echo ""
          echo "Total brands refreshed: $TOTAL"
